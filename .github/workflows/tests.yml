name: tests

permissions:
  contents: read

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  tests:
    name: PHP ${{ matrix.php }} - Laravel 13 - ${{ matrix.dependencies }} (scan)
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        php:
          - '8.4'
          - '8.5'
        dependencies:
          - lowest
          - published-0.25
          - adoption-minimum
          - adoption-current
        include:
          - {php: '8.5', dependencies: legacy-0.20}
          - {php: '8.5', dependencies: legacy-0.21}
          - {php: '8.5', dependencies: legacy-0.22}
          - {php: '8.5', dependencies: legacy-0.23}
          - {php: '8.5', dependencies: legacy-0.24}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          ini-values: memory_limit=1G

      - name: Preserve original manifest for guard tests
        run: cp composer.json "$RUNNER_TEMP/vector-composer.json"

      - name: Prepare published baseline
        if: matrix.dependencies == 'published-0.25' || startsWith(matrix.dependencies, 'legacy-')
        run: php .github/scripts/compatibility.php prepare '${{ matrix.dependencies }}'

      # This manifest and archive are pinned candidate inputs, not a published tag.
      - name: Prepare pinned core candidate
        if: startsWith(matrix.dependencies, 'adoption-')
        shell: bash
        run: |
          curl --fail --silent --show-error --location \
            https://raw.githubusercontent.com/builtbyberry/laravel-swarm/e25842cab4291837dcce2ff6f4815e58feab9079/composer.json \
            --output "$RUNNER_TEMP/core-candidate.json"
          php .github/scripts/compatibility.php prepare '${{ matrix.dependencies }}' "$RUNNER_TEMP/core-candidate.json"

      - name: Install current stable dependencies
        if: matrix.dependencies == 'published-0.25' || matrix.dependencies == 'adoption-current' || startsWith(matrix.dependencies, 'legacy-')
        run: composer update --prefer-stable --prefer-dist --no-interaction --no-progress

      - name: Install lowest dependencies
        if: matrix.dependencies == 'lowest' || matrix.dependencies == 'adoption-minimum'
        run: composer update --prefer-lowest --prefer-stable --prefer-dist --no-interaction --no-progress

      - name: Test dependency evidence guards
        run: php .github/scripts/compatibility-test.php "$RUNNER_TEMP/vector-composer.json"

      - name: Verify installed and locked dependencies
        run: php .github/scripts/compatibility.php verify '${{ matrix.dependencies }}'

      - name: Execute tests
        run: composer test -- --fail-on-skipped --fail-on-incomplete --fail-on-risky

      - name: Execute static analysis
        if: matrix.dependencies == 'published-0.25' || matrix.dependencies == 'adoption-current'
        run: |
          vendor/bin/phpstan clear-result-cache
          composer analyse

      - name: Execute code style check
        if: matrix.dependencies == 'published-0.25' || matrix.dependencies == 'adoption-current'
        run: composer lint

  pgvector:
    name: PHP 8.4 - ${{ matrix.dependencies }} (pgvector)
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        dependencies:
          - published-0.25
          - adoption-minimum
          - adoption-current

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: swarm
          POSTGRES_PASSWORD: swarm
          POSTGRES_DB: swarm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U swarm"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: swarm_test
      DB_USERNAME: swarm
      DB_PASSWORD: swarm

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql
          tools: composer:v2
          ini-values: memory_limit=1G

      - name: Preserve original manifest for guard tests
        run: cp composer.json "$RUNNER_TEMP/vector-composer.json"

      - name: Prepare published baseline
        if: matrix.dependencies == 'published-0.25'
        run: php .github/scripts/compatibility.php prepare '${{ matrix.dependencies }}'

      # This manifest and archive are pinned candidate inputs, not a published tag.
      - name: Prepare pinned core candidate
        if: startsWith(matrix.dependencies, 'adoption-')
        shell: bash
        run: |
          curl --fail --silent --show-error --location \
            https://raw.githubusercontent.com/builtbyberry/laravel-swarm/e25842cab4291837dcce2ff6f4815e58feab9079/composer.json \
            --output "$RUNNER_TEMP/core-candidate.json"
          php .github/scripts/compatibility.php prepare '${{ matrix.dependencies }}' "$RUNNER_TEMP/core-candidate.json"

      - name: Install current stable dependencies
        if: matrix.dependencies == 'published-0.25' || matrix.dependencies == 'adoption-current'
        run: composer update --prefer-stable --prefer-dist --no-interaction --no-progress

      - name: Install lowest dependencies
        if: matrix.dependencies == 'adoption-minimum'
        run: composer update --prefer-lowest --prefer-stable --prefer-dist --no-interaction --no-progress

      - name: Test dependency evidence guards
        run: php .github/scripts/compatibility-test.php "$RUNNER_TEMP/vector-composer.json"

      - name: Verify installed and locked dependencies
        run: php .github/scripts/compatibility.php verify '${{ matrix.dependencies }}'

      - name: Execute tests
        run: composer test -- --fail-on-skipped --fail-on-incomplete --fail-on-risky
