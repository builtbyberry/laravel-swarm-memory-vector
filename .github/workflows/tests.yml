name: tests

permissions:
  contents: read

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  tests:
    name: PHP ${{ matrix.php }} - Laravel 13 - ${{ matrix.dependencies }} (scan)
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        php:
          - '8.4'
          - '8.5'
        dependencies:
          - stable-latest
          - lowest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          ini-values: memory_limit=1G

      - name: Install dependencies
        if: matrix.dependencies == 'stable-latest'
        run: composer update --prefer-stable --prefer-dist --no-interaction --no-progress

      - name: Install lowest dependencies
        if: matrix.dependencies == 'lowest'
        run: composer update --prefer-lowest --prefer-stable --prefer-dist --no-interaction --no-progress

      - name: Verify published Laravel Swarm release
        if: matrix.dependencies == 'stable-latest'
        shell: bash
        run: |
          composer show builtbyberry/laravel-swarm --format=json | php -r '
            $package = json_decode(stream_get_contents(STDIN), true, 512, JSON_THROW_ON_ERROR);
            $versions = $package["versions"] ?? [];
            if (! in_array("v0.25.0", $versions, true)) {
                fwrite(STDERR, "Expected published Laravel Swarm v0.25.0.\n");
                exit(1);
            }

            $reference = $package["source"]["reference"] ?? null;
            $expectedReference = "be7df78e8fde12362cfff9007cfe723d572a5e4f";
            if ($reference !== $expectedReference) {
                fwrite(STDERR, "Expected Laravel Swarm source.reference {$expectedReference}; got ".var_export($reference, true).".\n");
                exit(1);
            }

            echo "Installed published Laravel Swarm v0.25.0 at {$reference}.\n";
          '

      - name: Execute tests
        run: composer test

      - name: Execute static analysis
        if: matrix.dependencies == 'stable-latest'
        run: composer analyse

      - name: Execute code style check
        if: matrix.dependencies == 'stable-latest'
        run: composer lint

  pgvector:
    name: PHP 8.4 - pgvector (Postgres)
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: swarm
          POSTGRES_PASSWORD: swarm
          POSTGRES_DB: swarm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U swarm"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: swarm_test
      DB_USERNAME: swarm
      DB_PASSWORD: swarm

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql
          tools: composer:v2
          ini-values: memory_limit=1G

      - name: Install dependencies
        run: composer update --prefer-stable --prefer-dist --no-interaction --no-progress

      - name: Verify published Laravel Swarm release
        shell: bash
        run: |
          composer show builtbyberry/laravel-swarm --format=json | php -r '
            $package = json_decode(stream_get_contents(STDIN), true, 512, JSON_THROW_ON_ERROR);
            $versions = $package["versions"] ?? [];
            if (! in_array("v0.25.0", $versions, true)) {
                fwrite(STDERR, "Expected published Laravel Swarm v0.25.0.\n");
                exit(1);
            }

            $reference = $package["source"]["reference"] ?? null;
            $expectedReference = "be7df78e8fde12362cfff9007cfe723d572a5e4f";
            if ($reference !== $expectedReference) {
                fwrite(STDERR, "Expected Laravel Swarm source.reference {$expectedReference}; got ".var_export($reference, true).".\n");
                exit(1);
            }

            echo "Installed published Laravel Swarm v0.25.0 at {$reference}.\n";
          '

      - name: Execute tests against native pgvector
        run: composer test
